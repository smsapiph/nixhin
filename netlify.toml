# Netlify deploys the Vite frontend (dist/) and the Hono API as one Netlify Function
# (server/netlify/functions/api.ts, mounted at /api/*), so the browser calls same-origin /api.

[build]
  # Netlify installs the root dependencies itself; the API's live in server/.
  command = "npm ci --prefix server && npm run typecheck --prefix server && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "server/netlify/functions"
  node_bundler = "esbuild"
  # resvg (share-card PNG rendering, functions/og.ts) ships a native binary per platform;
  # esbuild cannot bundle it, so it is copied from server/node_modules as-is.
  external_node_modules = ["@resvg/resvg-js"]
  included_files = ["server/node_modules/@resvg/**"]

# TMDB images through this site: some internet providers block image.tmdb.org, which left movie and TV
# posters blank. The browser asks for /img/tmdb/w342/abc.jpg and Netlify fetches it from TMDB (src/lib/images.ts).
# Must come before the SPA fallback below.
[[redirects]]
  from = "/img/tmdb/*"
  to = "https://image.tmdb.org/t/p/:splat"
  status = 200
  force = true

# SPA fallback: serve index.html for any path that is not a file. /api/* never reaches this,
# because a function with a configured path runs before redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # frame-src lists the player origins: YouTube (trailers), the anime provider (STREAM_EMBED_TEMPLATE) and the
    # movie/TV provider (STREAM_MOVIE_TEMPLATE, STREAM_TV_TEMPLATE): player.lokal-delivery.com, with vsembed.ru kept
    # as a fallback so switching the env back works without a CSP change. Update it when a provider changes.
    # img-src uploads.mangadex.org and *.mangadex.network: fallbacks for manga covers and pages when this site's
    # /img/md/ function (server/netlify/functions/img.ts) fails (src/lib/images.ts).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://s4.anilist.co https://img.anili.st https://i.ytimg.com https://img.youtube.com https://image.tmdb.org https://uploads.mangadex.org https://*.mangadex.network; frame-src https://www.youtube-nocookie.com https://megaplay.buzz https://player.lokal-delivery.com https://vsembed.ru; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Vite fingerprints everything under /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
