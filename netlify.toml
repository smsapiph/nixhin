# Netlify deploys the Vite frontend (dist/) and the Hono API as one Netlify Function
# (server/netlify/functions/api.ts, mounted at /api/*), so the browser calls same-origin /api.

[build]
  # Netlify installs the root dependencies itself; the API's live in server/.
  command = "npm ci --prefix server && npm run typecheck --prefix server && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "server/netlify/functions"
  node_bundler = "esbuild"
  # resvg (share-card PNG rendering, functions/og.ts) ships a native binary per platform;
  # esbuild cannot bundle it, so it is copied from server/node_modules as-is.
  external_node_modules = ["@resvg/resvg-js"]
  included_files = ["server/node_modules/@resvg/**"]

# SPA fallback: serve index.html for any path that is not a file. /api/* never reaches this,
# because a function with a configured path runs before redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # frame-src lists the player origins: YouTube (trailers), the anime provider (STREAM_EMBED_TEMPLATE) and the
    # movie/TV provider (STREAM_MOVIE_TEMPLATE, STREAM_TV_TEMPLATE). Update it when a provider changes.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://s4.anilist.co https://img.anili.st https://i.ytimg.com https://img.youtube.com https://image.tmdb.org; frame-src https://www.youtube-nocookie.com https://megaplay.buzz https://vsembed.ru; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Vite fingerprints everything under /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
